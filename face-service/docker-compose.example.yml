services:
  face-service:
    build: .
    container_name: jumbocrab-face-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      FACE_SERVICE_API_KEY: "change-this-long-random-key"
      FACE_CTX_ID: "-1"
      FACE_DET_SIZE: "640"
      FACE_DET_SCORE_MIN: "0.60"
      FACE_MIN_BOX_RATIO: "0.16"
      FACE_MAX_BOX_RATIO: "0.72"
      FACE_MAX_ABS_YAW_RATIO: "0.12"
